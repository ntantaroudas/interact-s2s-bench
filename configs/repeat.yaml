# REPEATABILITY: computation-aware runs depend on measured compute times, so they are not
# bit-reproducible.  Re-run the four headline policies (large-v2) on four meetings, one per
# series, into a separate folder and compare with runs/ (scripts/repeatability.py).
partition: eval
meetings: [ES2004a, IS1009a, TS3003a, EN2002b]
audio_dir: data/ami/audio
out_dir: runs_repeat
device: cuda
compute_type: float16
download_root: models/faster-whisper
openai_model_dir: models/openai
models: [large-v2]
comp_unaware: false
policies:
  - {id: P1-h1.0-c0.25, policy: fixed, hop: 1.0, context: 0.25}
  - {id: P2-sil500, policy: vad, min_silence_ms: 500, max_utt: 15.0}
  - {id: P3-la-1.0, policy: localagreement, min_chunk: 1.0, vac: true}
  - {id: P4-aa-1.0, policy: alignatt, min_chunk: 1.0, vac: true, frame_threshold: 25}
